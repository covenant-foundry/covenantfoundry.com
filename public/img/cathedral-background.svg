<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="520" viewBox="0 0 1536 520" role="img" aria-labelledby="title desc">
	<title id="title">Covenant Foundry cathedral technical background</title>
	<desc id="desc">Dark industrial Art Deco cathedral arch with brass circuit traces and orange accents.</desc>
	<defs>
		<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0" stop-color="#0b0c0b" />
			<stop offset="0.5" stop-color="#11130f" />
			<stop offset="1" stop-color="#070807" />
		</linearGradient>
		<radialGradient id="centerGlow" cx="50%" cy="22%" r="44%">
			<stop offset="0" stop-color="#f47f16" stop-opacity="0.16" />
			<stop offset="0.38" stop-color="#b58a45" stop-opacity="0.08" />
			<stop offset="1" stop-color="#000" stop-opacity="0" />
		</radialGradient>
		<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
			<path d="M48 0H0V48" fill="none" stroke="#d8cdb8" stroke-opacity="0.055" stroke-width="1" />
			<path d="M24 0V48M0 24H48" fill="none" stroke="#b58a45" stroke-opacity="0.035" stroke-width="1" />
		</pattern>
		<filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f47f16" flood-opacity="0.36" />
		</filter>
		<style>
			.bg { fill: url(#bg); }
			.grid { fill: url(#grid); }
			.glow { fill: url(#centerGlow); }
			.brass { fill: none; stroke: #b58a45; stroke-width: 1.35; stroke-linecap: square; stroke-linejoin: miter; }
			.brass-soft { fill: none; stroke: #b58a45; stroke-width: 1; stroke-opacity: 0.46; stroke-linecap: square; stroke-linejoin: miter; }
			.brass-faint { fill: none; stroke: #b58a45; stroke-width: 1; stroke-opacity: 0.22; stroke-linecap: square; stroke-linejoin: miter; }
			.orange { fill: none; stroke: #f47f16; stroke-width: 1.45; stroke-linecap: square; stroke-linejoin: miter; }
			.orange-fill { fill: #f47f16; }
			.panel { fill: rgba(8, 8, 7, 0.34); stroke: #b58a45; stroke-width: 1; stroke-opacity: 0.28; }
			.dark-panel { fill: rgba(0, 0, 0, 0.2); }
			.content-veil { fill: #080807; fill-opacity: 0.46; }
		</style>
	</defs>

	<rect class="bg" width="1536" height="520" />
	<rect class="grid" width="1536" height="520" opacity="0.82" />
	<rect class="glow" width="1536" height="520" />

	<!-- Outer architectural frame -->
	<path class="brass-soft" d="M10 18H1526V502H10z" />
	<path class="brass-faint" d="M24 34H1512V486H24z" />
	<path class="brass" d="M0 78H24V34H78M1536 78h-24V34h-54M0 442h24v44h54M1536 442h-24v44h-54" />
	<path class="brass-soft" d="M60 58H148V102H222V458H60zM1476 58h-88v44h-74v356h162z" />

	<!-- Mirrored side chapel/circuit structures -->
	<g id="left-side">
		<path class="brass-soft" d="M20 124H142V470H20" />
		<path class="brass-faint" d="M34 152H120V470M52 180V470M72 300V470M94 340V470" />
		<path class="orange" d="M82 212V418" />
		<circle class="orange" cx="82" cy="204" r="7" />
		<circle class="orange-fill" cx="82" cy="204" r="2.4" />
		<path class="brass-faint" d="M120 130c74 0 112 36 112 108M120 160c52 0 82 28 82 78M120 190c32 0 52 18 52 48" />
		<path class="brass-soft" d="M18 458H156l22 22H354" />
		<path class="orange" d="M66 480H422l22-16H548" />
		<path class="brass-soft" d="M146 242h78l44 44h114l54-54h120" />
		<path class="brass-faint" d="M148 285h90l50 50h132M148 332h76l38 38h116" />
		<circle class="brass" cx="224" cy="242" r="3" />
		<circle class="orange" cx="268" cy="286" r="3" />
		<circle class="brass" cx="420" cy="335" r="3" />
	</g>
	<use href="#left-side" transform="translate(1536 0) scale(-1 1)" />

	<!-- Central cathedral arch, nested like the reference -->
	<path class="dark-panel" d="M312 478V250h36v-26h42v-24h58v-20h154C630 104 696 78 768 78s138 26 166 102h154v20h58v24h42v26h36v228z" />
	<path class="brass" d="M312 478V250h36v-26h42v-24h58v-20h154C630 104 696 78 768 78s138 26 166 102h154v20h58v24h42v26h36v228" />
	<path class="brass-soft" d="M338 478V268h36v-26h42v-24h58v-20h144C648 130 706 104 768 104s120 26 150 94h144v20h58v24h42v26h36v210" />
	<path class="brass-soft" d="M364 478V286h34v-26h40v-22h58v-18h136C660 154 714 130 768 130s108 24 136 90h136v18h58v22h40v26h34v192" />
	<path class="orange" d="M386 478V350h30v-26h38v-22h54M1150 478V350h-30v-26h-38v-22h-54" />
	<path class="brass-faint" d="M326 478H1210M336 466H1200M346 454H1190" />

	<!-- Top arch cap and layered step lines -->
	<path class="brass-soft" d="M532 154H642M894 154h110M626 154c24-62 78-92 142-92s118 30 142 92" />
	<path class="brass-faint" d="M566 134H648M888 134h82M650 134c23-38 61-58 118-58s95 20 118 58" />
	<path class="orange" d="M768 78V188" />
	<path class="brass-soft" d="M758 80V192M778 80V192" />

	<!-- Horizontal circuit traces through the arch -->
	<g filter="url(#softGlow)">
		<path class="orange" d="M604 142H708l18 18H810l18-18h104" />
		<path class="brass" d="M584 174H704l16 18H816l16-18h120" />
		<path class="brass-soft" d="M612 208H704l20 20H812l20-20h92" />
		<path class="brass-faint" d="M330 360H538l24 22H660M876 382h98l24-22h208" />
		<circle class="orange" cx="604" cy="142" r="3.5" />
		<circle class="orange" cx="932" cy="142" r="3.5" />
		<circle class="brass" cx="584" cy="174" r="3" />
		<circle class="brass" cx="952" cy="174" r="3" />
		<circle class="brass" cx="612" cy="208" r="3" />
		<circle class="brass" cx="924" cy="208" r="3" />
	</g>

	<!-- Darkened central text field so overlaid headings sit inside the arch like the mockup. -->
	<rect class="content-veil" x="372" y="220" width="792" height="190" />

	<!-- Logo halo / empty medallion seat -->
	<circle class="brass-soft" cx="768" cy="142" r="74" />
	<circle class="orange" cx="768" cy="142" r="52" opacity="0.54" />
	<path class="brass-faint" d="M768 38V258M688 142H848" />
	<circle class="orange-fill" cx="768" cy="478" r="5" />
	<circle class="brass" cx="768" cy="478" r="20" />
	<path class="orange" d="M768 458V498M748 478H788" />

	<!-- Side vertical statement panels from the reference -->
	<path class="brass-faint" d="M184 126V440M1352 126V440" />
	<path class="brass-soft" d="M188 442h120M1228 442h120M188 126h120M1228 126h120" />
	<path class="brass-faint" d="M204 172h70M1262 172h70M204 356h70M1262 356h70" />

	<!-- Bottom plinth and circuit rail -->
	<path class="brass" d="M64 484H706l20 18h84l20-18h642" />
	<path class="brass-soft" d="M88 470H690l22 18h112l22-18h602" />
	<path class="orange" d="M348 470H704M832 470h356" />
	<circle class="orange" cx="348" cy="470" r="3" />
	<circle class="orange" cx="1188" cy="470" r="3" />
	<circle class="brass" cx="704" cy="470" r="3" />
	<circle class="brass" cx="832" cy="470" r="3" />

	<!-- Deco corner teeth and small terminals -->
	<path class="brass" d="M356 224h-22v22h-22v22h-22v22M1180 224h22v22h22v22h22v22" />
	<path class="orange" d="M380 212h-18v18h-18v18M1156 212h18v18h18v18" />
	<path class="brass-soft" d="M84 350h16v16h16M1452 350h-16v16h-16M84 170h16v-16h16M1452 170h-16v-16h-16" />
</svg>
